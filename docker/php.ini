; Sentinel Slop overrides on top of php.ini-production. Applies to php-fpm and the CLI alike.

; The worker needs headroom for the profile stage of a large repository (laravel/framework peaks around
; 150 MB; the CLI default of 128M killed the first scan of it). sentinel:doctor --strict checks this value.
memory_limit = 1G

; The code never changes inside a container, so opcache need not stat files.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Only small forms and webhooks arrive over HTTP; repositories come through the worker.
upload_max_filesize = 8M
post_max_size = 8M
max_execution_time = 60

expose_php = Off
date.timezone = UTC
realpath_cache_size = 4096K
realpath_cache_ttl = 600
