; The `all` role: the whole application in one container, as Dog Desk runs. nginx and php-fpm serve the site, one
; worker runs the scan pipeline (one stage at a time, never two scans at once), another the default queue so a
; long scan never holds up anything else, and the scheduler runs prune and recover-interrupted.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --timeout matches sentinel.queue.job_timeout_seconds; the database queue's retry_after is set above it.
[program:scans-worker]
command=php artisan queue:work database --queue=scans --tries=1 --timeout=2700 --memory=512 --sleep=3 --no-ansi
user=www-data
directory=/var/www/html
environment=HOME="/var/www"
autorestart=true
stopwaitsecs=110
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:default-worker]
command=php artisan queue:work database --queue=default --tries=1 --timeout=120 --memory=256 --sleep=3 --no-ansi
user=www-data
directory=/var/www/html
environment=HOME="/var/www"
autorestart=true
stopwaitsecs=110
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work --no-ansi
user=www-data
directory=/var/www/html
environment=HOME="/var/www"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
