; php-fpm pool for the web role. The master runs as root under supervisord and the workers as www-data.
; Sized for the one 1 vCPU / 3 GB task that also runs a scan: a handful of children is plenty for this traffic.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
