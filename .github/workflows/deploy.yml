# Build, test, push, deploy.
#
# test    builds the Dockerfile's `test` target: the production image plus dev dependencies, running Pint,
#         PHPStan and the whole Pest suite against the analyser binaries that ship. Runs on every push and
#         pull request and needs no AWS access.
# push    (main only, after test) builds the `runtime` target from the same cache and pushes it to ECR
#         tagged with the commit SHA. Nothing reaches ECR that failed a test: the job depends on it.
# deploy  (main only, after push) registers a task-definition revision pointing at the new image and
#         updates the one service. The old task stops before the new one starts (SQLite has one writer); the
#         new task runs the migrations before it serves anything.
#
# Repository variable (Settings → Secrets and variables → Actions → Variables), from `terraform output`:
#   AWS_DEPLOY_ROLE_ARN        deploy_role_arn
# Everything else is a name the Terraform fixes.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-deploy of the current commit, e.g. after a Terraform apply changed a task definition.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: sentinel-slop
  ECS_CLUSTER: sentinel-slop-prod
  ECS_SERVICE: sentinel-slop-prod-app
  TASK_FAMILY: sentinel-slop-prod-app

jobs:
  test:
    name: Test inside the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the test target (Pint, PHPStan, Pest against the shipped binaries)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push:
    name: Push the runtime image
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # If this step ever fails with "Not authorized to perform sts:AssumeRoleWithWebIdentity", the token's
      # subject has changed shape: GitHub embeds the owner and repository ids
      # (repo:owner@123/name@456:ref:refs/heads/main) and the deploy role's trust policy matches that exact string.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build the runtime target and push it tagged with the commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Roll the service
    needs: push
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.push.outputs.image }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register a task-definition revision with the new image
        id: register
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition             | jq --arg image "$IMAGE" '
                .containerDefinitions[0].image = $image
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt)' > /tmp/app.json
          arn=$(aws ecs register-task-definition --cli-input-json file:///tmp/app.json --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=${arn}" >> "$GITHUB_OUTPUT"
          echo "registered ${arn}"

      # The new task migrates before supervisord starts anything; a failed migration stops the task and the
      # circuit breaker rolls the service back to the previous revision.
      - name: Update the service and wait for it to stabilise
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "${{ steps.register.outputs.arn }}" --query 'service.serviceName' --output text
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          echo "deployed ${IMAGE}"
